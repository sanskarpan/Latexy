# ─────────────────────────────────────────────────────────────────────────────
# Latexy — Local Development Stack
#
# All host-side ports and container names are parameterised so multiple
# worktrees can run side-by-side against the shared infra (postgres, redis,
# minio).
#
# Default (slot 1 / main worktree) — just `docker compose up`:
#   5180  → Next.js frontend
#   8030  → FastAPI backend + WebSocket
#   5434  → PostgreSQL (for DB clients like TablePlus)
#   5555  → Flower (Celery monitor)
#   9091  → RustFS Web Console (S3-compatible local object storage)
#
# Extra worktrees — use the helper script:
#   ./scripts/worktree-up.sh w2      # backend 8031, frontend 5181, flower 5556
#   ./scripts/worktree-up.sh w3      # backend 8032, frontend 5182, flower 5557
#
# Or manually:
#   SLOT=2 docker compose -p latexy-w2 up backend worker frontend
# ─────────────────────────────────────────────────────────────────────────────

x-slot: &slot "${SLOT:-1}"

x-backend-env: &backend-env
  DATABASE_URL: postgresql://latexy:latexy_password@postgres:5432/latexy
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin_secret
  MINIO_BUCKET: latexy
  BETTER_AUTH_URL: http://localhost:${FRONTEND_PORT:-5180}
  CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5180}","http://127.0.0.1:${FRONTEND_PORT:-5180}","http://localhost:5180","http://localhost:5181","http://localhost:5182","http://localhost:5183"]'
  TEMP_DIR: /app/temp
  PYTHONPATH: /app
  # Store .pyc files in a Docker-native volume (not the macOS-mounted source dir).
  # This avoids recompiling 1600+ Python files from the slow macOS volume mount on
  # every container restart — reducing cold-start from ~7min to ~45s.
  PYTHONPYCACHEPREFIX: /pycache

services:
  # ── PostgreSQL (pgvector-enabled for semantic matching) ─────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: latexy-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: latexy
      POSTGRES_PASSWORD: latexy_password
      POSTGRES_DB: latexy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latexy -d latexy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: latexy-redis
    restart: unless-stopped
    ports:
      # Keep the host binding project-specific. macOS/Homebrew commonly has a
      # local Redis on 6379; Docker Desktop can still publish the same port but
      # host processes then reach the native daemon instead of this container.
      - "${REDIS_PORT:-6380}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RustFS (MinIO-compatible S3 object storage) ──────────────────────────────
  minio:
    image: rustfs/rustfs:latest
    container_name: latexy-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9091}:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin_secret
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── MinIO bucket init ────────────────────────────────────────────────────────
  minio-init:
    image: amazon/aws-cli:latest
    container_name: latexy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done;
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket latexy 2>/dev/null ||
      aws --endpoint-url http://minio:9000 s3api create-bucket --bucket latexy;
      aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket latexy
      --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicReadGetObject","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::latexy/*"}]}';
      echo 'Local S3 bucket ready.'
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin_secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    restart: "no"

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: latexy-backend-${SLOT:-1}
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             python -m compileall /app/app -q &&
             uvicorn app.main:app --host 0.0.0.0 --port 8030 --log-level info --ws-max-size 524288 --reload --reload-dir /app/app"
    ports:
      - "${BACKEND_PORT:-8030}:8030"
    environment:
      <<: *backend-env
      PORT: 8030
      DEBUG: "false"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_temp_${SLOT:-1}:/app/temp
      - backend_pycache_${SLOT:-1}:/pycache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s

  # ── Celery Worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: latexy-worker-${SLOT:-1}
    restart: unless-stopped
    command: >
      watchmedo auto-restart --directory=/app/app --pattern="*.py" --recursive --
      celery -A app.core.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=latex,llm,combined,ats,cleanup,email
    environment:
      <<: *backend-env
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_temp_${SLOT:-1}:/app/temp
      - backend_pycache_${SLOT:-1}:/pycache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-I", "/app/app/core/worker_healthcheck.py"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  # ── Celery Beat ──────────────────────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: latexy-beat-${SLOT:-1}
    restart: unless-stopped
    command: >
      watchmedo auto-restart --directory=/app/app --pattern="*.py" --recursive --
      celery -A app.core.celery_app beat --loglevel=info --schedule=/var/lib/celery/beat.db
    environment:
      <<: *backend-env
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_pycache_${SLOT:-1}:/pycache
      - celery_beat_data_${SLOT:-1}:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: latexy-frontend-${SLOT:-1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5180}:${FRONTEND_PORT:-5180}"
    environment:
      DATABASE_URL: postgresql://latexy:latexy_password@postgres:5432/latexy
      BETTER_AUTH_URL: http://localhost:${FRONTEND_PORT:-5180}
      NEXT_PUBLIC_APP_URL: http://localhost:${FRONTEND_PORT:-5180}
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8030}
      NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-8030}
      PORT: ${FRONTEND_PORT:-5180}
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # ── Flower (Celery monitoring) ────────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: latexy-flower-${SLOT:-1}
    restart: unless-stopped
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      <<: *backend-env
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_temp_1:
  backend_temp_2:
  backend_temp_3:
  backend_temp_4:
  # Python bytecode cache — stored in Docker-native volumes (not the macOS mount)
  # so .pyc files are reused across container restarts without recompiling from source.
  backend_pycache_1:
  backend_pycache_2:
  backend_pycache_3:
  backend_pycache_4:
  celery_beat_data_1:
  celery_beat_data_2:
  celery_beat_data_3:
  celery_beat_data_4:

networks:
  default:
    name: latexy-network
