services:
  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network

  # Frontend Service
  frontend:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-frontend:${LATEXY_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # NEXT_PUBLIC_* are inlined into the browser bundle at build time.
        # NEXT_PUBLIC_WS_URL must be the absolute public ws(s):// origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL to the public WebSocket origin, e.g. wss://latexy.com}
    environment:
      - NODE_ENV=production
      - PORT=5180
      - NEXT_TELEMETRY_DISABLED=1
      # Better Auth runs *in this container* (nginx proxies /api/auth/ here).
      # lib/auth.ts throws without BETTER_AUTH_SECRET in production and opens a
      # pg Pool straight from DATABASE_URL, so both are mandatory.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public origin, e.g. https://latexy.com}
      # Server-only backend base. NEXT_PUBLIC_API_URL is the same-origin path
      # "/api", which Node's fetch() cannot parse; middleware.ts and the
      # /api/byok/ route handlers need an absolute in-cluster URL.
      - BACKEND_URL=http://backend:8030
      # nginx terminates client connections and overwrites X-Real-IP with
      # $$remote_addr, so the auth rate limiter may key on it. Without this the
      # limiter distrusts forwarding headers and puts every proxied caller in
      # one shared bucket.
      - TRUST_PROXY_HEADERS=true
      # Optional: social providers activate only when both halves are set.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Transactional email. lib/email.ts refuses to fall back to console
      # logging in production, so sign-up/password-reset throw without a key.
      - RESEND_API_KEY=${RESEND_API_KEY:?set RESEND_API_KEY (transactional email provider key)}
      - EMAIL_FROM=${EMAIL_FROM:-}
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5180/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Backend Service
  backend:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-backend:${LATEXY_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      # Settings reads ENVIRONMENT (app/core/config.py); anything else leaves the
      # app in "development" mode with docs exposed and CORS wide open.
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8030
      # nginx below is the only ingress and it overwrites X-Real-IP with
      # $$remote_addr, so the rate limiters can bucket per real client. Without
      # this every user shares one "untrusted proxy" bucket and any single caller
      # can 429 the whole site. Do NOT set it if the backend port is reachable
      # directly.
      - TRUST_PROXY_HEADERS=true
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      # JSON array — pydantic-settings parses List[str] fields as JSON,
      # e.g. CORS_ORIGINS=["https://latexy.com","https://www.latexy.com"]
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to a JSON array of public origins, e.g. ["https://latexy.com"]}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      # JSON object mapping coupon code -> Razorpay offer ID, e.g.
      # {"LAUNCH20":"offer_ABC123"}. Razorpay only discounts a subscription
      # through an offer, so a percentage coupon with no mapping here is
      # refused at checkout rather than charged at full price.
      - RAZORPAY_COUPON_OFFERS=${RAZORPAY_COUPON_OFFERS:-}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY (Fernet key, required in production)}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_MODE=${OTEL_EXPORTER_MODE:-otlp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-latexy}
    depends_on:
      - redis
      - postgres
      - tempo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Celery Worker
  celery-worker:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-backend:${LATEXY_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --queues=latex,llm,combined,ats,cleanup,email
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to a JSON array of public origins, e.g. ["https://latexy.com"]}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY (Fernet key, required in production)}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_MODE=${OTEL_EXPORTER_MODE:-otlp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-latexy}
    depends_on:
      - redis
      - postgres
      - tempo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Celery Beat Scheduler
  celery-beat:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-backend:${LATEXY_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY (Fernet key, required in production)}
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to a JSON array of public origins, e.g. ["https://latexy.com"]}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_MODE=${OTEL_EXPORTER_MODE:-otlp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-latexy}
    depends_on:
      - redis
      - tempo
    restart: unless-stopped
    volumes:
      - celery_beat_data:/app/celerybeat-schedule
    networks:
      - latexy-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Flower Monitoring (Optional)
  flower:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-backend:${LATEXY_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.core.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:?set FLOWER_USER}:${FLOWER_PASSWORD:?set FLOWER_PASSWORD}
    environment:
      # `celery -A app.core.celery_app` imports app.core.config, so flower needs
      # the same required settings as the workers.
      - ENVIRONMENT=production
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY (Fernet key, required in production)}
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to a JSON array of public origins, e.g. ["https://latexy.com"]}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - latexy-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # PostgreSQL Database (for development - use managed DB in production)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-latexy}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    # Bound to loopback: these UIs ship no authentication of their own
    # (prometheus exposes every internal metric, alertmanager lets anyone
    # silence alerts). Reach them over an SSH tunnel or `compose exec`.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - latexy-network
    depends_on:
      - backend
      - redis-exporter
      - postgres-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    # Bound to loopback: these UIs ship no authentication of their own
    # (prometheus exposes every internal metric, alertmanager lets anyone
    # silence alerts). Reach them over an SSH tunnel or `compose exec`.
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.base.yml:ro
      - ./scripts/monitoring/render-alertmanager-config.sh:/etc/alertmanager/render-alertmanager-config.sh:ro
    command:
      - sh
      - -c
      - /etc/alertmanager/render-alertmanager-config.sh /etc/alertmanager/alertmanager.generated.yml && /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.generated.yml --storage.path=/alertmanager
    restart: unless-stopped
    networks:
      - latexy-network
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_SLACK_WEBHOOK_URL=${ALERT_SLACK_WEBHOOK_URL:-}
      - ALERT_SLACK_CHANNEL=${ALERT_SLACK_CHANNEL:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_SMARTHOST=${ALERT_SMARTHOST:-}
      - ALERT_EMAIL_USER=${ALERT_EMAIL_USER:-}
      - ALERT_EMAIL_PASSWORD=${ALERT_EMAIL_PASSWORD:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}

  tempo:
    image: grafana/tempo:latest
    # Bound to loopback: these UIs ship no authentication of their own
    # (prometheus exposes every internal metric, alertmanager lets anyone
    # silence alerts). Reach them over an SSH tunnel or `compose exec`.
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
    restart: unless-stopped
    networks:
      - latexy-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - latexy-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-latexy}?sslmode=disable
      - PG_EXPORTER_DISABLE_DEFAULT_METRICS=false
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=false
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - latexy-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    # Loopback only — reach the dashboard over an SSH tunnel rather than
    # publishing an admin UI on the host's public interface.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - latexy-network

volumes:
  redis_data:
  postgres_data:
  celery_beat_data:
  prometheus_data:
  grafana_data:

networks:
  latexy-network:
    driver: bridge
