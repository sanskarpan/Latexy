services:
  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./nginx/ssl:/etc/ssl:ro
      - ./nginx/logs:/var/log/nginx
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:?set NGINX_SERVER_NAME to the public hostname}
    command:
      - /bin/sh
      - -c
      - envsubst '$$NGINX_SERVER_NAME' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network

  # Frontend Service
  frontend:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-frontend:${LATEXY_VERSION:?set LATEXY_VERSION to an immutable release tag or sha}
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        # NEXT_PUBLIC_* are inlined into the browser bundle at build time.
        # NEXT_PUBLIC_WS_URL must be the absolute public ws(s):// origin.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL to the public origin, e.g. https://latexy.xyz}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL to the public WebSocket origin, e.g. wss://latexy.xyz}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public origin, e.g. https://latexy.xyz}
        BUILD_VERSION: ${BUILD_VERSION:-local}
    environment:
      - NODE_ENV=production
      - PORT=5180
      - NEXT_TELEMETRY_DISABLED=1
      # Better Auth runs *in this container* (nginx proxies /api/auth/ here).
      # lib/auth.ts throws without BETTER_AUTH_SECRET in production and opens a
      # pg Pool straight from DATABASE_URL, so both are mandatory.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public origin, e.g. https://latexy.xyz}
      # Server-only backend base. NEXT_PUBLIC_API_URL is the same-origin path
      # "/api", which Node's fetch() cannot parse; middleware.ts and the
      # /api/byok/ route handlers need an absolute in-cluster URL.
      - BACKEND_URL=http://backend:8030
      # nginx terminates client connections and overwrites X-Real-IP with
      # $$remote_addr, so the auth rate limiter may key on it. Without this the
      # limiter distrusts forwarding headers and puts every proxied caller in
      # one shared bucket.
      - TRUST_PROXY_HEADERS=true
      # Optional: social providers activate only when both halves are set.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Transactional email. lib/email.ts refuses to fall back to console
      # logging in production, so sign-up/password-reset throw without a key.
      - RESEND_API_KEY=${RESEND_API_KEY:?set RESEND_API_KEY (transactional email provider key)}
      - EMAIL_FROM=${EMAIL_FROM:-}
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5180/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Backend Service
  backend:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-backend:${LATEXY_VERSION:?set LATEXY_VERSION to an immutable release tag or sha}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      # Settings reads ENVIRONMENT (app/core/config.py); anything else leaves the
      # app in "development" mode with docs exposed and CORS wide open.
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8030
      # nginx below is the only ingress and it overwrites X-Real-IP with
      # $$remote_addr, so the rate limiters can bucket per real client. Without
      # this every user shares one "untrusted proxy" bucket and any single caller
      # can 429 the whole site. Do NOT set it if the backend port is reachable
      # directly.
      - TRUST_PROXY_HEADERS=true
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      # JSON array — pydantic-settings parses List[str] fields as JSON,
      # e.g. CORS_ORIGINS=["https://latexy.xyz","https://www.latexy.xyz"]
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to a JSON array of public origins, e.g. ["https://latexy.xyz"]}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-latexy}
      # Optional export integrations. Google Drive stays unavailable until its
      # OAuth client is configured; document email stays disabled by default.
      - GOOGLE_DRIVE_CLIENT_ID=${GOOGLE_DRIVE_CLIENT_ID:-}
      - GOOGLE_DRIVE_CLIENT_SECRET=${GOOGLE_DRIVE_CLIENT_SECRET:-}
      - GOOGLE_DRIVE_REDIRECT_URI=${GOOGLE_DRIVE_REDIRECT_URI:-}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@latexy.io}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Latexy}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DODO_MODE=${DODO_MODE:-test}
      - DODO_TEST_API_KEY=${DODO_TEST_API_KEY:-}
      - DODO_TEST_WEBHOOK_KEY=${DODO_TEST_WEBHOOK_KEY:-}
      - DODO_TEST_BUSINESS_ID=${DODO_TEST_BUSINESS_ID:-}
      - DODO_LIVE_API_KEY=${DODO_LIVE_API_KEY:-}
      - DODO_LIVE_WEBHOOK_KEY=${DODO_LIVE_WEBHOOK_KEY:-}
      - DODO_LIVE_BUSINESS_ID=${DODO_LIVE_BUSINESS_ID:-}
      - DODO_TEST_PRODUCT_BASIC_MONTHLY=${DODO_TEST_PRODUCT_BASIC_MONTHLY:-}
      - DODO_TEST_PRODUCT_BASIC_ANNUAL=${DODO_TEST_PRODUCT_BASIC_ANNUAL:-}
      - DODO_TEST_PRODUCT_PRO_MONTHLY=${DODO_TEST_PRODUCT_PRO_MONTHLY:-}
      - DODO_TEST_PRODUCT_PRO_ANNUAL=${DODO_TEST_PRODUCT_PRO_ANNUAL:-}
      - DODO_TEST_PRODUCT_BYOK_MONTHLY=${DODO_TEST_PRODUCT_BYOK_MONTHLY:-}
      - DODO_TEST_PRODUCT_BYOK_ANNUAL=${DODO_TEST_PRODUCT_BYOK_ANNUAL:-}
      - DODO_TEST_PRODUCT_STUDENT=${DODO_TEST_PRODUCT_STUDENT:-}
      - DODO_TEST_PRODUCT_TEAM=${DODO_TEST_PRODUCT_TEAM:-}
      - DODO_TEST_PRODUCT_WEEKLY=${DODO_TEST_PRODUCT_WEEKLY:-}
      - DODO_TEST_PRODUCT_LIFETIME=${DODO_TEST_PRODUCT_LIFETIME:-}
      - DODO_LIVE_PRODUCT_BASIC_MONTHLY=${DODO_LIVE_PRODUCT_BASIC_MONTHLY:-}
      - DODO_LIVE_PRODUCT_BASIC_ANNUAL=${DODO_LIVE_PRODUCT_BASIC_ANNUAL:-}
      - DODO_LIVE_PRODUCT_PRO_MONTHLY=${DODO_LIVE_PRODUCT_PRO_MONTHLY:-}
      - DODO_LIVE_PRODUCT_PRO_ANNUAL=${DODO_LIVE_PRODUCT_PRO_ANNUAL:-}
      - DODO_LIVE_PRODUCT_BYOK_MONTHLY=${DODO_LIVE_PRODUCT_BYOK_MONTHLY:-}
      - DODO_LIVE_PRODUCT_BYOK_ANNUAL=${DODO_LIVE_PRODUCT_BYOK_ANNUAL:-}
      - DODO_LIVE_PRODUCT_STUDENT=${DODO_LIVE_PRODUCT_STUDENT:-}
      - DODO_LIVE_PRODUCT_TEAM=${DODO_LIVE_PRODUCT_TEAM:-}
      - DODO_LIVE_PRODUCT_WEEKLY=${DODO_LIVE_PRODUCT_WEEKLY:-}
      - DODO_LIVE_PRODUCT_LIFETIME=${DODO_LIVE_PRODUCT_LIFETIME:-}
      - WEEKLY_AMOUNT_MINOR=${WEEKLY_AMOUNT_MINOR:-0}
      - LIFETIME_AMOUNT_MINOR=${LIFETIME_AMOUNT_MINOR:-0}
      - BILLING_CURRENCY=${BILLING_CURRENCY:-INR}
      - REFERRAL_PROGRAM_ENABLED=${REFERRAL_PROGRAM_ENABLED:-false}
      - REFERRAL_REWARD_DAYS=${REFERRAL_REWARD_DAYS:-0}
      - REFERRAL_QUALIFYING_PLAN_FAMILIES=${REFERRAL_QUALIFYING_PLAN_FAMILIES:-["basic","pro","byok","student","team","weekly","lifetime"]}
      - REFERRAL_MAX_ATTRIBUTIONS_PER_REFERRER=${REFERRAL_MAX_ATTRIBUTIONS_PER_REFERRER:-1000}
      - REFERRAL_ATTRIBUTION_WINDOW_HOURS=${REFERRAL_ATTRIBUTION_WINDOW_HOURS:-24}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY (Fernet key, required in production)}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_MODE=${OTEL_EXPORTER_MODE:-otlp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-latexy}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Celery Worker
  celery-worker:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-backend:${LATEXY_VERSION:?set LATEXY_VERSION to an immutable release tag or sha}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --queues=latex,llm,combined,ats,cleanup,email
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to a JSON array of public origins, e.g. ["https://latexy.xyz"]}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-latexy}
      # Email notification tasks run on this worker, so keep its provider
      # settings aligned with the API service.
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@latexy.io}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Latexy}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY (Fernet key, required in production)}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_MODE=${OTEL_EXPORTER_MODE:-otlp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-latexy}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Celery Beat Scheduler
  celery-beat:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-backend:${LATEXY_VERSION:?set LATEXY_VERSION to an immutable release tag or sha}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY (Fernet key, required in production)}
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to a JSON array of public origins, e.g. ["https://latexy.xyz"]}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_MODE=${OTEL_EXPORTER_MODE:-otlp}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-latexy}
    depends_on:
      - redis
      - tempo
    restart: unless-stopped
    volumes:
      - celery_beat_data:/app/celerybeat-schedule
    networks:
      - latexy-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Flower Monitoring (Optional)
  flower:
    image: ${LATEXY_IMAGE_PREFIX:-ghcr.io/sanskarpan}/latexy-backend:${LATEXY_VERSION:?set LATEXY_VERSION to an immutable release tag or sha}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: celery -A app.core.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:?set FLOWER_USER}:${FLOWER_PASSWORD:?set FLOWER_PASSWORD}
    environment:
      # `celery -A app.core.celery_app` imports app.core.config, so flower needs
      # the same required settings as the workers.
      - ENVIRONMENT=production
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY (Fernet key, required in production)}
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to a JSON array of public origins, e.g. ["https://latexy.xyz"]}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - latexy-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Private S3-compatible object storage for compiled PDFs and share links.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - latexy-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 '$${MINIO_ACCESS_KEY}' '$${MINIO_SECRET_KEY}' &&
        mc mb --ignore-existing 'local/$${MINIO_BUCKET}'
      "
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-latexy}
    restart: "no"
    networks:
      - latexy-network

  # PostgreSQL Database (pgvector-enabled; replace DATABASE_URL with a managed
  # service and disable this service if desired).
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-latexy}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - latexy-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    # Bound to loopback: these UIs ship no authentication of their own
    # (prometheus exposes every internal metric, alertmanager lets anyone
    # silence alerts). Reach them over an SSH tunnel or `compose exec`.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - latexy-network
    depends_on:
      - backend
      - redis-exporter
      - postgres-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    # Bound to loopback: these UIs ship no authentication of their own
    # (prometheus exposes every internal metric, alertmanager lets anyone
    # silence alerts). Reach them over an SSH tunnel or `compose exec`.
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.base.yml:ro
      - ./scripts/monitoring/render-alertmanager-config.sh:/etc/alertmanager/render-alertmanager-config.sh:ro
    command:
      - sh
      - -c
      - /etc/alertmanager/render-alertmanager-config.sh /etc/alertmanager/alertmanager.generated.yml && /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.generated.yml --storage.path=/alertmanager
    restart: unless-stopped
    networks:
      - latexy-network
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_SLACK_WEBHOOK_URL=${ALERT_SLACK_WEBHOOK_URL:-}
      - ALERT_SLACK_CHANNEL=${ALERT_SLACK_CHANNEL:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_SMARTHOST=${ALERT_SMARTHOST:-}
      - ALERT_EMAIL_USER=${ALERT_EMAIL_USER:-}
      - ALERT_EMAIL_PASSWORD=${ALERT_EMAIL_PASSWORD:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}

  tempo:
    image: grafana/tempo:latest
    # Bound to loopback: these UIs ship no authentication of their own
    # (prometheus exposes every internal metric, alertmanager lets anyone
    # silence alerts). Reach them over an SSH tunnel or `compose exec`.
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
    restart: unless-stopped
    networks:
      - latexy-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - latexy-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-latexy}?sslmode=disable
      - PG_EXPORTER_DISABLE_DEFAULT_METRICS=false
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=false
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - latexy-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    # Loopback only — reach the dashboard over an SSH tunnel rather than
    # publishing an admin UI on the host's public interface.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - latexy-network

volumes:
  redis_data:
  postgres_data:
  celery_beat_data:
  prometheus_data:
  grafana_data:
  minio_data:

networks:
  latexy-network:
    driver: bridge
