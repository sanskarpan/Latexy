<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Latexy Job Companion</title>
    <link rel="icon" href="icons/icon-32.png" type="image/png">
    <link rel="stylesheet" href="extension.css">
  </head>
  <body class="popup">
    <header>
      <strong class="brand"><img src="icons/icon-32.png" width="24" height="24" alt="">Latexy Job Companion</strong>
      <span id="source" class="muted"></span>
    </header>
    <p id="status" role="status">Reading this tab…</p>
    <label>Company<input id="company" maxlength="200" autocomplete="organization"></label>
    <label>Role<input id="title" maxlength="200" autocomplete="organization-title"></label>
    <label>Location<input id="location" maxlength="200"></label>
    <label>Job description<textarea id="description" maxlength="20000" rows="7"></textarea></label>
    <label>Posting URL<input id="url" maxlength="500" type="url"></label>
    <button id="save" class="primary" disabled>Review and save in Latexy</button>
    <button id="autofill">Autofill this application</button>
    <button id="options" class="link">Edit local autofill profile</button>
    <p class="fineprint">Nothing is submitted automatically. Capture data stays in extension storage for at most 15 minutes and is removed after Latexy imports it.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
