groups:
  - name: latexy.service
    rules:
      - alert: ServiceDown
        expr: up{job=~"latexy-backend|redis-exporter|postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute."
          runbook: "docs/observability/runbooks.md#servicedown"

      - alert: BackendHighErrorRate
        expr: sum(rate(latexy_http_requests_total{job="latexy-backend",status_code=~"5.."}[5m])) / clamp_min(sum(rate(latexy_http_requests_total{job="latexy-backend"}[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High HTTP 5xx error rate on backend"
          description: "Backend 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."
          runbook: "docs/observability/runbooks.md#backendhigherrorrate"

      - alert: SlowBackendResponses
        expr: histogram_quantile(0.95, sum by (le) (rate(latexy_http_request_duration_seconds_bucket{job="latexy-backend"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow backend responses (p95 > 2s)"
          description: "95th percentile response time is {{ $value | humanizeDuration }}."
          runbook: "docs/observability/runbooks.md#slowbackendresponses"

      - alert: CeleryTaskFailures
        expr: increase(latexy_celery_tasks_total{status=~"failure|failed"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Celery task failures detected"
          description: "{{ $value }} tasks failed within the last 5 minutes."
          runbook: "docs/observability/runbooks.md#celerytaskfailures"

  - name: latexy.application
    rules:
      - alert: LLMHighErrorRate
        expr: sum(rate(latexy_llm_requests_total{status="error"}[5m])) / clamp_min(sum(rate(latexy_llm_requests_total[5m])), 1) > 0.10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "LLM call error rate above 10%"
          description: "{{ $value | humanizePercentage }} of LLM calls failed over the last 5 minutes."
          runbook: "docs/observability/runbooks.md#llmhigherrorrate"

      - alert: LLMSlowProviderCalls
        expr: histogram_quantile(0.95, sum by (le) (rate(latexy_llm_latency_seconds_bucket{phase="provider_call"}[10m]))) > 45
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "LLM provider calls slow (p95 > 45s)"
          description: "95th percentile LLM provider-call latency is {{ $value | humanizeDuration }}."
          runbook: "docs/observability/runbooks.md#llmslowprovidercalls"

      - alert: CompileFailureRate
        expr: sum(rate(latexy_compiles_total{status="error"}[10m])) / clamp_min(sum(rate(latexy_compiles_total[10m])), 1) > 0.20
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "LaTeX compile failure rate above 20%"
          description: "{{ $value | humanizePercentage }} of compilations failed over the last 10 minutes."
          runbook: "docs/observability/runbooks.md#compilefailurerate"

      - alert: CeleryQueueBacklog
        expr: latexy_celery_queue_depth > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Celery queue backlog on {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending messages for more than 5 minutes."
          runbook: "docs/observability/runbooks.md#celeryqueuebacklog"

      - alert: DBPoolSaturation
        expr: latexy_db_pool_connections{state="checked_out"} >= (latexy_db_pool_connections{state="size"} + latexy_db_pool_connections{state="overflow"})
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Database connection pool saturated"
          description: "All pooled connections ({{ $value }}) are checked out; requests may be queuing for a connection."
          runbook: "docs/observability/runbooks.md#dbpoolsaturation"

  - name: latexy.redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is not responding."
          runbook: "docs/observability/runbooks.md#redisdown--redishighmemory"

      - alert: RedisHighMemory
        expr: (redis_memory_used_bytes / clamp_min(redis_memory_max_bytes, 1)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis memory usage above 80%"
          description: "Redis is using {{ $value | humanize }}% of max memory."
          runbook: "docs/observability/runbooks.md#redisdown--redishighmemory"

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[1m]) > 0
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis is rejecting connections"
          description: "Redis rejected {{ $value }} connections in the last minute."
          runbook: "docs/observability/runbooks.md#redisdown--redishighmemory"

      - alert: RedisApplicationDependencyDown
        expr: latexy_redis_dependency_up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Latexy Redis dependency is unavailable"
          description: "The application Redis role {{ $labels.role }} has failed commands for at least one minute."
          runbook: "docs/observability/runbooks.md#redis-provider-request-capacity"

      - alert: RedisProviderCapacityWarning
        expr: latexy_redis_provider_capacity_status{status="warning"} == 1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis monthly request capacity above warning threshold"
          description: "Rotate or upgrade the provider before the request cap is exhausted."
          runbook: "docs/observability/runbooks.md#redis-provider-request-capacity"

      - alert: RedisProviderCapacityCritical
        expr: latexy_redis_provider_capacity_status{status=~"critical|exhausted"} == 1
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis monthly request capacity is critical"
          description: "The configured provider is at or beyond the critical request-capacity threshold."
          runbook: "docs/observability/runbooks.md#redis-provider-request-capacity"

      - alert: RedisProviderHardExhaustion
        expr: max_over_time(latexy_redis_provider_exhausted[5m]) == 1
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis rejected a command because its request quota is exhausted"
          description: "The {{ $labels.role }} Redis client received a hard provider request-limit error."
          runbook: "docs/observability/runbooks.md#redis-provider-request-capacity"

      - alert: RedisCapacityMonitorBlind
        expr: latexy_redis_provider_capacity_status{status=~"unconfigured|misconfigured|unavailable"} == 1
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis provider capacity monitoring is blind"
          description: "Capacity metadata is {{ $labels.status }}; restore monitoring before the provider reaches a hard cap."
          runbook: "docs/observability/runbooks.md#redis-provider-request-capacity"

  - name: latexy.postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is not responding."
          runbook: "docs/observability/runbooks.md#postgresdown--postgrestoomanyconnections--postgresdeadlocks"

      - alert: PostgresTooManyConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL has too many active connections"
          description: "{{ $value }} active connections (limit ~100)."
          runbook: "docs/observability/runbooks.md#postgresdown--postgrestoomanyconnections--postgresdeadlocks"

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname="latexy"}[5m]) > 5
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "{{ $value }} deadlocks in the last 5 minutes."
          runbook: "docs/observability/runbooks.md#postgresdown--postgrestoomanyconnections--postgresdeadlocks"
