version: 2
updates:
  # Python backend dependencies
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    # Batch minor/patch backend bumps into one weekly PR (same rationale as npm).
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Only update patch versions for major packages to reduce noise
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "celery"
        update-types: ["version-update:semver-major"]
      # pydantic-core is pinned transitively by pydantic (==2.33.2 for 2.11.7);
      # it can't move without a pydantic bump — bump pydantic itself instead.
      - dependency-name: "pydantic-core"

  # Node dependencies — this is a pnpm WORKSPACE.
  #
  # directory MUST be the repo root (/), where pnpm-workspace.yaml and the single
  # pnpm-lock.yaml live — NOT /frontend. Dependabot discovers every workspace
  # member (frontend, packages/*) and updates the ONE root lockfile that CI and
  # Vercel actually validate. Pointing it at /frontend made Dependabot update a
  # stray npm package-lock.json (now deleted + gitignored) and leave the pnpm
  # lockfile stale, so `pnpm install --frozen-lockfile` failed CI on every PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    # Batch low-risk minor/patch bumps into a SINGLE PR. With one shared root
    # lockfile, separate per-package PRs each carry a lockfile change and
    # serialize (only one merges cleanly at a time) — grouping avoids that and
    # cuts red-CI churn to one coherent update per week.
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # @react-three/drei 10 requires react@19 + @react-three/fiber@9; this app
      # is on react 18 + fiber 8. Hold major drei bumps until a React 19 upgrade.
      - dependency-name: "@react-three/drei"
        update-types: ["version-update:semver-major"]
      # eslint 9/10 is flat-config only; `next lint` (Next 14) doesn't support it.
      # Hold eslint majors until the lint tooling migrates.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # react-pdf 10 jumps to pdfjs-dist 5, which references browser globals
      # (DOMMatrix) at import time → breaks Next SSR/build, and needs same-origin
      # worker hosting + render verification. A real migration, not a bump; do it
      # with (or after) the Next 16 / React 19 modernization. Hold majors.
      - dependency-name: "react-pdf"
        update-types: ["version-update:semver-major"]
      # typescript 7 is the native (Go) preview compiler — hold majors until GA.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # monaco-editor 0.56 added a package `exports` map that breaks y-monaco
      # @0.1.6's deep import `monaco-editor/esm/vs/editor/editor.api.js`
      # (double-prefixes esm/vs → module-not-found, fails the frontend build).
      # y-monaco has no compatible release yet, so hold monaco at 0.55.x.
      - dependency-name: "monaco-editor"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels:
      - dependencies
      - ci
