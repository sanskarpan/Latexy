name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/latexy-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/latexy-frontend

jobs:
  validate-release:
    name: Validate main ancestry and CI provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require an immutable main commit with successful canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_sha="$(git rev-parse --verify "${GITHUB_REF_NAME}^{commit}")"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag does not resolve to the immutable event SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Refusing to release $tag_sha: it is not reachable from main" >&2
            exit 1
          fi
          ci_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${tag_sha}&branch=main&status=completed&per_page=100")"
          if ! jq -e --arg sha "$tag_sha" \
            'any(.workflow_runs[]?; .head_sha == $sha and .head_branch == "main" and .conclusion == "success")' \
            <<<"$ci_runs" >/dev/null; then
            echo "Refusing to release $tag_sha: no successful canonical CI run exists" >&2
            exit 1
          fi

  # ── Build & push backend image ─────────────────────────────────────────────
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [validate-release]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ github.sha }}

  # ── Build & push frontend image ────────────────────────────────────────────
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [validate-release]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_WS_URL is inlined into the bundle and must be the
          # absolute public ws(s):// origin — the client appends /ws/jobs and
          # passes the result to `new URL()`. Defaults to this repo's own public
          # origin (same value as k8s/namespace.yaml's ws-url and nginx's
          # server_name); override with the NEXT_PUBLIC_WS_URL repo variable
          # (Settings → Variables) when publishing for another domain. An unset
          # variable would render empty and hard-abort the Dockerfile guard.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://latexy.xyz' }}
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'wss://latexy.xyz' }}
            BUILD_VERSION=${{ github.sha }}

  # ── Create GitHub Release ──────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-backend, build-frontend]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: false
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changes }}

            ## Docker Images

            ```
            ghcr.io/${{ github.repository_owner }}/latexy-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/latexy-frontend:${{ github.ref_name }}
            ```

            ## Deploy

            ```bash
            # Point compose at this release (see LATEXY_VERSION in docker-compose.prod.yml)
            export LATEXY_VERSION=${{ github.ref_name }}

            # Pull the exact release images before starting application processes
            docker compose -f docker-compose.prod.yml --env-file .env.production pull

            # Wait for stateful dependencies; minio-init is a one-shot job.
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --wait postgres redis minio tempo
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm --no-deps minio-init

            # Migrate with the exact backend image before starting any new revision
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm --no-deps backend alembic upgrade head

            # Start the already-pulled images without rebuilding
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build
            ```
