name: Publish TUI to npm

on:
  push:
    tags:
      - "tui-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/tui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.10.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing requires npm >=11.5.1. Pinning the CLI keeps the
      # authentication path reproducible even when the Node image changes.
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.10.1

      - name: Validate tag and unpublished version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#tui-v}"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to publish a commit that is not on main" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" == "$tag_version" || "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME must exactly match tui-v$package_version" >&2
            exit 1
          fi

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --access public
