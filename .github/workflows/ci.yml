name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every job is read-only. Keep the implicit GITHUB_TOKEN least-privileged so a
# compromised build/test dependency cannot write repository contents or metadata.
permissions:
  contents: read

# Superseded PR revisions need no duplicate runners. Main and manual runs keep
# separate groups and are never cancelled by a newer PR or main push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classification is deliberately fail-closed. A missing event range, an
  # unknown path, or a classifier/runtime error makes every scoped job run.
  # This job never decides whether the privacy guard runs: that guard remains
  # unconditional for every non-cancelled workflow below.
  classify-changes:
    name: Classify Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      tui: ${{ steps.classify.outputs.tui }}
      extension: ${{ steps.classify.outputs.extension }}
      render_cv: ${{ steps.classify.outputs.render_cv }}
      templates: ${{ steps.classify.outputs.templates }}
      observability: ${{ steps.classify.outputs.observability }}
      full_stack: ${{ steps.classify.outputs.full_stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Test the dependency-free classifier
        run: node --test scripts/ci/classify-changes.test.mjs
      - id: classify
        name: Classify changed components (fail closed)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          output_tmp="$(mktemp)"
          trap 'rm -f "$output_tmp"' EXIT
          if GITHUB_OUTPUT="$output_tmp" node scripts/ci/classify-changes.mjs; then
            declare -A seen=()
            line_count=0
            valid=true
            while IFS= read -r line; do
              line_count=$((line_count + 1))
              key="${line%%=*}"
              value="${line#*=}"
              case "${key}=${value}" in
                backend=true|backend=false|frontend=true|frontend=false|tui=true|tui=false|extension=true|extension=false|render_cv=true|render_cv=false|templates=true|templates=false|observability=true|observability=false|full_stack=true|full_stack=false)
                  if [[ -n "${seen[$key]+present}" ]]; then
                    valid=false
                  fi
                  seen["$key"]=1
                  ;;
                *)
                  valid=false
                  ;;
              esac
            done < "$output_tmp"
            if [ "$line_count" -ne 8 ] || [ "${#seen[@]}" -ne 8 ]; then
                valid=false
            fi
            if [ "$valid" = true ]; then
              cat "$output_tmp" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Classifier failed or emitted an incomplete result; running all scoped jobs."
          for scope in backend frontend tui extension render_cv templates observability full_stack; do
            echo "${scope}=true" >> "$GITHUB_OUTPUT"
          done

  # ── Security and privacy guards ─────────────────────────────────────────────
  # Enforces the "no session recording on document surfaces" principle (#1410):
  # fails the build if a keystroke-capture / heatmap SDK (Clarity, Hotjar,
  # FullStory, Inspectlet, LogRocket, Qualaroo, Smartlook, Mouseflow) is
  # introduced into shipped frontend code. Pure grep — no deps, no services.
  privacy-guard:
    name: Privacy Guard (no session recording)
    needs: classify-changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed if component classification failed
        if: ${{ needs.classify-changes.result != 'success' }}
        run: |
          echo "Component classification failed; refusing to report privacy checks as passed."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert no session-recording SDKs in shipped frontend code
        run: bash scripts/ci/no-session-recording.sh
      - name: Assert documentation contains no plaintext account credentials
        run: bash scripts/ci/no-plaintext-credentials.sh
      - name: Assert public copy avoids unsubstantiated ATS and catalog claims
        run: bash scripts/ci/no-unsubstantiated-marketing-claims.sh

  # ── Backend ────────────────────────────────────────────────────────────────
  # The private harness tests live outside pytest's backend/test discovery
  # tree. Keep this unconditional and source-only: no Modal SDK, credentials,
  # services, or infrastructure are used.
  modal-harness-synthetic:
    name: Modal Harness Synthetic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run explicitly selected, dependency-free harness regressions
        run: python scripts/qa/run_modal_spawn_diagnostics.py

  backend-lint:
    name: Backend Lint (ruff)
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Verify generated Python locks are fresh
        run: |
          set -euo pipefail
          lock_tmp="$(mktemp -d)"
          trap 'rm -rf "$lock_tmp"' EXIT
          # Validate the committed resolution against its inputs, retaining
          # compatible transitive pins. An empty output path would resolve
          # today's latest registry versions instead of checking this lock.
          cp requirements.lock "$lock_tmp/requirements.lock"
          cp requirements-dev.lock "$lock_tmp/requirements-dev.lock"
          uv pip compile --universal --python-version 3.12 --generate-hashes \
            --custom-compile-command 'uv pip compile --universal --python-version 3.12 --generate-hashes requirements.txt -o requirements.lock' \
            requirements.txt -o "$lock_tmp/requirements.lock"
          uv pip compile --universal --python-version 3.12 --generate-hashes \
            --custom-compile-command 'uv pip compile --universal --python-version 3.12 --generate-hashes requirements-dev.txt -o requirements-dev.lock' \
            requirements-dev.txt -o "$lock_tmp/requirements-dev.lock"
          # A universal resolution retains platform markers and covers Windows,
          # macOS, and Linux from the same resolved lock data. Compare pins,
          # markers, and hashes (not resolver provenance comments).
          diff -u <(sed '/^[[:space:]]*#/d' requirements.lock) \
            <(sed '/^[[:space:]]*#/d' "$lock_tmp/requirements.lock")
          diff -u <(sed '/^[[:space:]]*#/d' requirements-dev.lock) \
            <(sed '/^[[:space:]]*#/d' "$lock_tmp/requirements-dev.lock")
      - name: Install the hash-verified development lock
        run: uv pip sync --require-hashes --verify-hashes requirements-dev.lock
      - name: Run ruff
        run: uv run ruff check app/ test/

  # Guards the class of bug that caused P0 outages #954 and #956: code that is
  # correct in local dev and wrong on Modal (the real production target), on a
  # deployment path that had no test coverage at all. Deliberately a separate job
  # with NO service containers — the suite is pure static analysis over
  # modal_app.py, so it stays fast and cannot be skipped for want of a database.
  deployment-parity:
    name: Modal Deployment Parity
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SKIP_INFRA_CHECK: "true"
      SKIP_ENV_VALIDATION: "true"
      # test_importing_the_app_never_raises_when_optional_providers_are_unset
      # re-imports app.main in a subprocess with every optional provider blank, so
      # only the hard-required secrets are supplied here.
      JWT_SECRET_KEY: ci-jwt-secret-key-00000000000000000000000000000000
      BETTER_AUTH_SECRET: ci-better-auth-secret-00000000000000000000000000000000
      API_KEY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DEBUG: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: "backend/requirements-dev.lock"
      - name: Install hash-verified development dependencies
        run: uv pip sync --require-hashes --verify-hashes requirements-dev.lock
      - name: Run deployment-parity guards
        run: uv run pytest test/test_modal_deployment_parity.py -v --tb=short

  template-pdf-contract:
    name: Template PDF Extraction Contract
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.templates == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the production-default compiler and extraction tools
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          texlive-latex-extra texlive-fonts-recommended cm-super
          texlive-science texlive-luatex fonts-lohit-deva fonts-noto-core fonts-texgyre poppler-utils
      - name: Verify every seeded template's extracted PDF contract
        run: bash scripts/verify-template-extraction.sh

  backend-test:
    name: Backend Tests
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: latexy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/latexy_test
      # These tests create and drop UUID-named schemas only on this job's
      # disposable loopback PostgreSQL service.
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/latexy_test
      TEST_POSTGRES_ALLOW_SCHEMA_CREATE: "1"
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_CACHE_URL: redis://localhost:6379/14
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      SKIP_ENV_VALIDATION: "true"
      # Deterministic CI-only values. Ordinary PR jobs must not receive repository secrets.
      JWT_SECRET_KEY: ci-jwt-secret-key-00000000000000000000000000000000
      BETTER_AUTH_SECRET: ci-better-auth-secret-00000000000000000000000000000000
      # API_KEY_ENCRYPTION_KEY must be a valid Fernet key (32 url-safe base64 bytes)
      API_KEY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      OPENAI_API_KEY: ""
      DEBUG: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: "backend/requirements-dev.lock"

      - name: Install hash-verified development dependencies
        run: uv pip sync --require-hashes --verify-hashes requirements-dev.lock

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Verify schema cutover compatibility on disposable PostgreSQL
        run: uv run pytest -vv -ra test/test_schema_rollout_compatibility.py test/test_modal_schema_cutover_gate.py

      - name: Verify B05 and F10/F11 real route recovery
        run: |
          uv run pytest -vv -ra \
            test/test_specialty_template_policy_integration.py \
            test/test_tenant_capability_recovery_integration.py \
            --junitxml=test-results/feature-control-integration.xml \
            -W error::ResourceWarning \
            -W error::RuntimeWarning \
            -W error::pytest.PytestUnraisableExceptionWarning
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('test-results/feature-control-integration.xml').getroot()
          cases = list(root.iter('testcase'))
          expected = {
              ('test_specialty_template_policy_integration',
               f'test_specialty_catalog_assets_revoke_and_restore_via_real_policy[{axis}-{role}]')
              for axis in ('global', 'role')
              for role in ('anonymous', 'user', 'support', 'admin')
          }
          expected.update(
              ('test_tenant_capability_recovery_integration', f'{name}[{axis}]')
              for name in (
                  'test_f10_denial_preserves_invitation_and_membership_removal_then_recovers',
                  'test_f11_denial_preserves_verified_domain_and_allows_removal_then_new_admission',
              )
              for axis in ('global', 'role', 'plan_family')
          )
          actual = {(case.get('classname', '').rsplit('.', 1)[-1], case.get('name')) for case in cases}
          if (len(cases) != 14 or actual != expected
                  or any(list(root.iter(tag)) for tag in ('skipped', 'failure', 'error'))):
              raise SystemExit('Feature-control integration evidence is incomplete, skipped or failed')
          print('B05/F10/F11 real route recovery: 14 passed, zero skipped/errors/failures')
          PY

      - name: Run tests
        run: >-
          uv run pytest --tb=short -q
          -W error::ResourceWarning
          -W error::RuntimeWarning
          -W error::pytest.PytestUnraisableExceptionWarning

      - name: Retain feature-control integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feature-control-integration-evidence
          path: backend/test-results/feature-control-integration.xml
          if-no-files-found: error

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint (ESLint)
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit complete JavaScript dependency graph
        env:
          DEPENDENCY_AUDIT_REPORT_PATH: ${{ runner.temp }}/latexy-dependency-audit-summary.json
        # Include development tooling: test/build dependencies execute trusted
        # repository code in CI and a critical Vitest advisory was previously
        # invisible to the production-only audit.
        run: |
          node --test ../scripts/ci/sharp-runtime.test.cjs
          node --test ../scripts/ci/dependency-audit.test.mjs
          node ../scripts/ci/audit-dependencies.mjs
      - name: Upload dependency audit summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latexy-dependency-audit-summary
          path: ${{ runner.temp }}/latexy-dependency-audit-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run ESLint
        run: pnpm lint
      - name: Run frontend unit regressions
        run: pnpm test:unit

  frontend-build:
    name: Frontend Build
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.frontend == 'true' || needs.classify-changes.outputs.full_stack == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_URL: "http://localhost:5180"
      NEXT_PUBLIC_API_URL: "http://localhost:8030"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8030"
      BETTER_AUTH_SECRET: ci-better-auth-secret-00000000000000000000000000000000
      # next build runs in production mode; keep WebAuthn's HTTPS invariant.
      # This is build-only metadata, not a live auth listener or external call.
      BETTER_AUTH_URL: "https://localhost:5180"
      DATABASE_URL: postgresql://postgres@localhost:5432/latexy_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  browser-extension:
    name: Browser Extension
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.extension == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test extraction and explicit autofill
        run: pnpm --filter @latexy/browser-extension test
      - name: Validate the Manifest V3 package
        run: pnpm --filter @latexy/browser-extension check
      - name: Build unpacked-install archive
        working-directory: packages/browser-extension
        run: >-
          zip -r ../../latexy-browser-extension.zip
          manifest.json capabilities.js extraction.js autofill.js bridge.js popup.html popup.js
          options.html options.js extension.css icons README.md
      - name: Upload extension archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latexy-browser-extension
          path: latexy-browser-extension.zip
          if-no-files-found: error
          retention-days: 30

  render-cv-action:
    name: Reusable Render CV Action
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.render_cv == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # action.yml runs on GitHub's current JavaScript-action runtime.
          node-version: "24"
      - name: Validate the dependency-free action entrypoint
        run: node --check actions/render-cv/index.js
      - name: Test API, credential, path, and atomic-output boundaries
        run: node --test actions/render-cv/test/*.test.cjs

  cross-browser-quality:
    name: Cross-Browser Quality
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.frontend == 'true' || needs.classify-changes.outputs.full_stack == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_URL: "http://localhost:5182"
      NEXT_PUBLIC_API_URL: "http://localhost:8030"
      NEXT_PUBLIC_WS_URL: "ws://localhost:5182"
      BETTER_AUTH_SECRET: ci-better-auth-secret-00000000000000000000000000000000
      BETTER_AUTH_URL: "http://localhost:5182"
      DATABASE_URL: postgresql://postgres@localhost:5432/latexy_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify workspace search close/reopen in Chromium
        env:
          PLAYWRIGHT_PORT: "5185"
          PLAYWRIGHT_SERVER_MODE: production
        run: >-
          pnpm exec playwright test e2e/project-search.spec.ts
          --grep 'close and reopen clears prior search results, query, and error in the browser DOM'
          --project=chromium --workers=1 --retries=0 --trace=on --reporter=line
          --output=test-results/workspace-search
      - name: Verify admin capabilities and plan catalog
        env:
          PLAYWRIGHT_PORT: "5184"
          PLAYWRIGHT_SERVER_MODE: production
        # Synthetic API fixtures only: no model, payment, email or OAuth provider.
        run: >-
          pnpm exec playwright test --config=playwright.capabilities.config.ts
          --workers=1 --retries=0 --trace=on --reporter=line
          --output=test-results/admin-capabilities
      - name: Verify public UI when optional worker registration is denied
        timeout-minutes: 30
        env:
          PLAYWRIGHT_PWA_POLICY_PORT: "5195"
        run: |
          node --test scripts/pwa-policy-acceptance.test.mjs
          node scripts/pwa-policy-acceptance.mjs
      - name: Verify production service-worker lifecycle and offline owner isolation
        timeout-minutes: 30
        env:
          PLAYWRIGHT_PWA_PORT: "5193"
        # Uses a disposable production build with real workers enabled. Account
        # and private-response fixtures are synthetic; no live provider is used.
        # The runner requires every named case with zero skips or retries.
        run: |
          node --test scripts/pwa-acceptance.test.mjs
          node scripts/pwa-acceptance.mjs
      # Fail closed if a required production-bundle owner suite drops out of the selection.
      - name: Validate the Chromium owner-regression suite manifest
        run: node ../scripts/ci/verify-owner-regression-manifest.mjs
      - name: Verify guided builder, compile cadence and source-PDF synchronization
        id: editor-owner-regressions
        env:
          PLAYWRIGHT_PORT: "5183"
          PLAYWRIGHT_SERVER_MODE: production
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/editor-compile-sync/results.json
        # Reuse one disposable production bundle for builder, editor and Settings owner
        # regressions with synthetic HTTP/WS/PDF/provider fixtures. No TeX
        # installation, provider credentials or live backend is required.
        run: |
          set -euo pipefail
          rm -f test-results/editor-compile-sync/results.json
          pnpm exec playwright test e2e/editor-compile-sync.spec.ts \
          e2e/resume-builder.spec.ts \
          e2e/builder-capabilities.spec.ts \
          e2e/billing-developer.spec.ts \
          e2e/settings-provider-action-owner-isolation.spec.ts \
          e2e/onboarding-owner-isolation.spec.ts \
          e2e/settings-preferences-owner-race.spec.ts \
          e2e/settings-legacy-callback-owner-isolation.spec.ts \
          e2e/personal-dictionary-owner-isolation.spec.ts \
          e2e/settings-passkey-owner-isolation.spec.ts \
          e2e/linked-variant-owner-race.spec.ts \
          e2e/compiler-selector-keyboard.spec.ts \
          e2e/builder-saved-owner-race.spec.ts \
          e2e/editor-shortcuts-focus.spec.ts \
          --project=chromium --workers=1 --retries=0 --trace=on --reporter=line,json \
          --output=test-results/editor-compile-sync
          node ../scripts/ci/verify-owner-regression-manifest.mjs --report=test-results/editor-compile-sync/results.json
      - name: Audit desktop and mobile browser quality
        run: pnpm test:quality --retries=0
      - name: Extract landing screenshots for review
        if: ${{ !cancelled() && hashFiles('frontend/playwright-quality-report/index.html') != '' }}
        env:
          LANDING_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/extract-landing-evidence.py playwright-quality-report landing-visual-evidence
      - name: Upload landing screenshots
        if: ${{ !cancelled() && hashFiles('frontend/landing-visual-evidence/capture.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-visual-evidence
          path: frontend/landing-visual-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Upload ReviewDesk validation screenshots
        if: ${{ !cancelled() && hashFiles('frontend/playwright-quality-report/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewdesk-validation-visual-evidence
          path: |
            docs/qa/reviewdesk-followup-2026-10-20/320-light-normal-errors.png
            docs/qa/reviewdesk-followup-2026-10-20/320-light-normal-disabled-hover.png
            docs/qa/reviewdesk-followup-2026-10-20/320-light-high-errors.png
            docs/qa/reviewdesk-followup-2026-10-20/320-light-high-disabled-hover.png
            docs/qa/reviewdesk-followup-2026-10-20/320-dark-normal-errors.png
            docs/qa/reviewdesk-followup-2026-10-20/320-dark-normal-disabled-hover.png
            docs/qa/reviewdesk-followup-2026-10-20/320-dark-high-errors.png
            docs/qa/reviewdesk-followup-2026-10-20/320-dark-high-disabled-hover.png
            docs/qa/reviewdesk-followup-2026-10-20/1440-light-normal-errors.png
            docs/qa/reviewdesk-followup-2026-10-20/1440-light-normal-disabled-hover.png
            docs/qa/reviewdesk-followup-2026-10-20/1440-light-high-errors.png
            docs/qa/reviewdesk-followup-2026-10-20/1440-light-high-disabled-hover.png
            docs/qa/reviewdesk-followup-2026-10-20/1440-dark-normal-errors.png
            docs/qa/reviewdesk-followup-2026-10-20/1440-dark-normal-disabled-hover.png
            docs/qa/reviewdesk-followup-2026-10-20/1440-dark-high-errors.png
            docs/qa/reviewdesk-followup-2026-10-20/1440-dark-high-disabled-hover.png
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose the failed Settings hydration callback
        if: ${{ failure() && steps.editor-owner-regressions.outcome == 'failure' && hashFiles('frontend/test-results/editor-compile-sync/settings-legacy-callback-o-b4eb6-r-the-session-token-rotates-chromium/trace.zip') != '' && hashFiles('frontend/test-results/editor-compile-sync/settings-legacy-callback-o-b4eb6-r-the-session-token-rotates-chromium/error-context.md') != '' }}
        timeout-minutes: 15
        env:
          LEGACY_SETTINGS_HYDRATION_DIAGNOSTICS: "1"
          PLAYWRIGHT_PORT: "5184"
          PLAYWRIGHT_SERVER_MODE: production
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/settings-hydration-diagnostic/results.xml
        # Failure-only evidence, never acceptance or a retry of the required
        # matrix. Keep the original failed outcome and artifacts untouched.
        run: |
          set -euo pipefail
          original="test-results/editor-compile-sync/settings-legacy-callback-o-b4eb6-r-the-session-token-rotates-chromium/error-context.md"
          if ! grep -Fq 'Minified React error #418' "$original"; then
            echo "Original failure was not React #418; no hydration diagnostic replay."
            exit 0
          fi
          pnpm exec playwright test e2e/settings-legacy-callback-owner-isolation.spec.ts \
            --project=chromium --workers=1 --retries=0 --trace=on --reporter=line,junit \
            --grep 'same-owner GitHub legacy callback succeeds after the session token rotates$' \
            --output=test-results/settings-hydration-diagnostic
          python3 -c "import xml.etree.ElementTree as E; cases=list(E.parse('test-results/settings-hydration-diagnostic/results.xml').getroot().iter('testcase')); failed=len(cases)!=1 or any(c.find(t) is not None for c in cases for t in ('skipped','failure','error')); exit('Diagnostic replay was empty, skipped or failed' if failed else 0)"
      - name: Verify Better Auth snapshot and vendored host replay contracts
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          # The baseline expected-error mode is a local diagnostic only; CI runs
          # the gated candidate and must never silently switch to that mode.
          HYDRATION_AUTH_CLIENT_BASELINE: "0"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/hydration-session-store/results.xml
        # The original owner/quality outcome remains required. This synthetic
        # causal proof runs even after that failure, without retrying or masking it.
        run: |
          set -euo pipefail
          rm -f test-results/hydration-session-store/results.xml
          pnpm exec playwright test e2e/hydration-session-store.opt-in.ts e2e/hydration-host-replay.opt-in.ts \
            --config=playwright.hydration.config.ts --workers=1 --retries=0 \
            --trace=on --reporter=line,junit --output=test-results/hydration-session-store
          python3 -c "import xml.etree.ElementTree as E; cases=list(E.parse('test-results/hydration-session-store/results.xml').getroot().iter('testcase')); expected={'real Better Auth SSR snapshot stays stable for a late consumer and refreshes safely','pinned Next host replay reproduces #418 and the upstream cursor backport preserves SSR nodes'}; failed=len(cases)!=2 or {c.get('name') for c in cases}!=expected or any(c.find(t) is not None for c in cases for t in ('skipped','failure','error')); exit('Hydration proof was empty, partial, skipped or failed' if failed else 0)"
      - name: Upload browser quality evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-quality-report
          path: |
            frontend/playwright-quality-report
            frontend/test-results/quality
            frontend/test-results/workspace-search
            frontend/test-results/admin-capabilities
            frontend/test-results/editor-compile-sync
            frontend/test-results/hydration-session-store
            frontend/test-results/settings-hydration-diagnostic
            frontend/test-results/pwa
            frontend/test-results/pwa-policy
          if-no-files-found: warn
          retention-days: 14

  tui-test:
    name: TUI Tests
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.tui == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tui
    env:
      # The live suites refuse to run unless this is set outside $HOME. /logout calls
      # clearConfig(), and during an earlier audit round it destroyed a developer's real
      # session token — so the guard is load-bearing, not decorative. Point it at the
      # runner's temp dir so the guard is satisfied even though no live test runs here.
      # A literal path, not ${{ runner.temp }}: the `runner` context is not
      # available in a job-level env block and GitHub rejects the whole workflow
      # file for it — which fails the run before any job starts, so it does not
      # show up as a job failure.
      XDG_CONFIG_HOME: /tmp/latexy-ci-xdg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # packages/tui declares engines.node >=22; frontend jobs also pin 22.
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      # No LATEXY_LIVE: the 66 live tests need a backend, worker, Postgres, Redis and
      # (for sign-in) the Next.js app, and they skip cleanly without it. The remaining
      # 164 need nothing, and they are what four audit rounds' worth of invariants live
      # in — the registry/dispatch parity check, websocket lifecycle, config atomicity,
      # retry safety and argv parsing.
      - name: Test
        run: pnpm test

  full-stack-smoke:
    name: Full-Stack Smoke
    runs-on: ubuntu-latest
    needs: [classify-changes, backend-test, frontend-build]
    if: >-
      ${{ !cancelled() &&
      (needs.classify-changes.result != 'success' ||
      needs.classify-changes.outputs.full_stack == 'true') &&
      (needs.backend-test.result == 'success' ||
      (needs.classify-changes.result == 'success' &&
      needs.classify-changes.outputs.backend == 'false' &&
      needs.backend-test.result == 'skipped')) &&
      needs.frontend-build.result == 'success' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: latexy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/latexy_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-jwt-secret-key-00000000000000000000000000000000
      BETTER_AUTH_SECRET: ci-better-auth-secret-00000000000000000000000000000000
      API_KEY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BILLING_MODE: disabled
      ENVIRONMENT: staging
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: "backend/requirements-dev.lock"

      - name: Install hash-verified backend dependencies
        working-directory: backend
        run: uv pip sync --require-hashes --verify-hashes requirements-dev.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/latexy-sharing-browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify D14 actual HTTP admissions
        run: bash scripts/ci/d14-http-admission.sh

      - name: Verify sharing isolation guards
        run: |
          python scripts/ci/sharing-storage-fixture.test.py -v
          python scripts/ci/sharing-full-stack-smoke.test.py -v

      - name: Run full-stack smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/latexy-sharing-browsers
        run: python scripts/ci/sharing-full-stack-smoke.py --confirm-isolated-sharing-run
      - name: Upload real full-stack browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-full-stack-report
          path: frontend/test-results/full-stack
          if-no-files-found: error
          retention-days: 14

  real-compile-preview:
    name: Isolated Real Compile and Preview
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.backend == 'true' || needs.classify-changes.outputs.frontend == 'true' || needs.classify-changes.outputs.templates == 'true' || needs.classify-changes.outputs.full_stack == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deliberately no repository/environment secrets. The launcher creates
    # ephemeral synthetic signing/storage values and fresh service data.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test isolation, readiness, cleanup and fail-closed evidence guards
        run: python scripts/ci/isolated-compile.test.py -v
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PDF text extraction and managed Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/latexy-real-compile-browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Verify actual worker artifacts and latest-source browser preview
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/latexy-real-compile-browsers
        # The production Dockerfile owns TeX/font/format assets. The proof runs
        # native TeX with unchanged Linux confinement inside a nonroot image,
        # not Docker-in-Docker; it is not Modal VM certification or an SLO.
        run: >-
          python scripts/ci/isolated-real-compile.py --confirm-isolated-ci-run
          --evidence-dir "${{ runner.temp }}/latexy-real-compile-evidence"
      - name: Upload isolated functional evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latexy-real-compile-evidence
          path: ${{ runner.temp }}/latexy-real-compile-evidence
          if-no-files-found: warn
          retention-days: 14

  observability-smoke:
    name: Observability Smoke
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.observability == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate observability stack
        run: bash scripts/ci/observability-smoke.sh
