name: Deploy Modal Backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to deploy
        required: true
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: modal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main

    steps:
      - name: Check out the CI-validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0

      - name: Validate immutable main revision and canonical CI success
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          deploy_sha="$(git rev-parse --verify "${DEPLOY_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$deploy_sha" origin/main; then
            echo "Refusing to deploy $deploy_sha: it is not reachable from main" >&2
            exit 1
          fi
          ci_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${deploy_sha}&branch=main&status=completed&per_page=100")"
          if ! jq -e --arg sha "$deploy_sha" \
            'any(.workflow_runs[]?; .head_sha == $sha and .head_branch == "main" and .conclusion == "success")' \
            <<<"$ci_runs" >/dev/null; then
            echo "Refusing to deploy $deploy_sha: no successful canonical CI run exists" >&2
            exit 1
          fi
          echo "Validated deployment SHA: $deploy_sha"
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Skip stale automatic deployment
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$latest_sha" != "$DEPLOY_SHA" ]]; then
            echo "Automatic CI run is stale ($DEPLOY_SHA); current main is $latest_sha. Skipping deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned Modal CLI
        if: steps.freshness.outputs.current == 'true'
        run: python -m pip install "modal==1.5.4"

      # modal_app.py deliberately keeps migrations separate from API startup.
      # Apply them first so incompatible application code is never made live.
      - name: Apply production database migrations
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        run: modal run --env main modal_app.py::migrate

      - name: Deploy backend with a rolling update
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        run: modal deploy --env main --strategy rolling --tag "$DEPLOY_SHA" modal_app.py

      - name: Synchronize source-owned production templates
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        run: modal run --env main modal_app.py::sync_templates

      - name: Backfill missing template previews
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        run: modal run --env main scripts/backfill_template_assets.py

      - name: Verify production backend health
        if: steps.freshness.outputs.current == 'true'
        env:
          BACKEND_URL: https://sanskarpandey2004--latexy-backend-fastapi-app.modal.run
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 20 "$BACKEND_URL/health" \
                | grep -q '"status":"healthy"' \
              && curl --fail --silent --show-error --max-time 20 "$BACKEND_URL/readyz" \
                | grep -q '"status":"ready"' \
              && curl --fail --silent --show-error --max-time 20 "$BACKEND_URL/jobs/health" \
                | grep -q '"status":"healthy"'; then
              exit 0
            fi
            echo "Health check attempt ${attempt}/18 failed; retrying in 10s"
            sleep 10
          done
          echo "Production backend did not become healthy after deployment" >&2
          exit 1

      - name: Verify source template catalog and assets
        if: steps.freshness.outputs.current == 'true'
        env:
          BACKEND_URL: https://sanskarpandey2004--latexy-backend-fastapi-app.modal.run
        run: |
          expected=$(find backend/app/data/templates/presentation -type f -name '*.tex' | wc -l | tr -d ' ')
          payload=$(curl --fail --silent --show-error --max-time 20 \
            "$BACKEND_URL/templates/?category=presentation")
          actual=$(jq 'length' <<<"$payload")
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected $expected presentation templates, production returned $actual" >&2
            exit 1
          fi
          jq -r '.[] | .thumbnail_url, .pdf_url' <<<"$payload" | while read -r asset; do
            curl --fail --silent --show-error --location --max-time 30 --output /dev/null "$asset"
          done
