name: Deploy Modal Backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to deploy
        required: true
        default: main
      traffic_mode:
        description: Keep public requests and background work held, or release a previously held candidate
        type: choice
        required: true
        default: held
        options:
          - held
          - release

permissions:
  contents: read
  actions: read

concurrency:
  group: modal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      # Non-secret, operator-certified identity. Keep this job-scoped so every
      # preflight/build/deploy uses the same API and compile-worker image inputs.
      MODAL_ENGINE_VM_CERTIFIED: ${{ vars.MODAL_ENGINE_VM_CERTIFIED }}
      MODAL_ENGINE_VM_IMAGE_ID: ${{ vars.MODAL_ENGINE_VM_IMAGE_ID }}
      MODAL_ENGINE_VM_ASSETS_FINGERPRINT: ${{ vars.MODAL_ENGINE_VM_ASSETS_FINGERPRINT }}
      # Optional name of a dedicated Modal secret containing Dodo settings.
      MODAL_BILLING_SECRET_NAME: ${{ vars.MODAL_BILLING_SECRET_NAME }}
      # Static binding for held recovery checks. Alternate Redis remains held
      # until authoritative state recovery is separately implemented.
      MODAL_REDIS_SECRET_NAME: ${{ vars.MODAL_REDIS_SECRET_NAME }}
      MODAL_REDIS_RECOVERY_FREEZE_ID: ${{ vars.MODAL_REDIS_RECOVERY_FREEZE_ID }}
      # Automatic runs and ordinary manual runs always deploy in held mode.
      # Only an explicit manual release input can open API and worker traffic.
      MODAL_DEPLOYMENT_TRAFFIC_HOLD: ${{ github.event_name != 'workflow_dispatch' || inputs.traffic_mode != 'release' }}
      MODAL_TRAFFIC_RELEASE_APPROVED_SHA: ${{ vars.MODAL_TRAFFIC_RELEASE_APPROVED_SHA }}

    steps:
      - name: Check out the CI-validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0

      - name: Validate immutable main revision and canonical CI success
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          deploy_sha="$(git rev-parse --verify "${DEPLOY_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$deploy_sha" origin/main; then
            echo "Refusing to deploy $deploy_sha: it is not reachable from main" >&2
            exit 1
          fi
          ci_validated=false
          for attempt in $(seq 1 6); do
            ci_runs=""
            if ci_runs="$(timeout --kill-after=5s 20s gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${deploy_sha}&branch=main&status=completed&per_page=100" 2>/dev/null)" \
              && jq -e --arg sha "$deploy_sha" \
                'type == "object" and (.workflow_runs | type) == "array" and
                 any(.workflow_runs[]; type == "object" and .head_sha == $sha and
                   .head_branch == "main" and .conclusion == "success")' \
                <<<"$ci_runs" >/dev/null 2>/dev/null; then
              ci_validated=true
              break
            fi
            if [[ "$attempt" -lt 6 ]]; then
              echo "Canonical CI lookup unavailable or result not yet visible (attempt ${attempt}/6); retrying in 5s" >&2
              sleep 5
            fi
          done
          if [[ "$ci_validated" != true ]]; then
            echo "Refusing to deploy $deploy_sha: no successful canonical CI run exists" >&2
            exit 1
          fi
          echo "Validated deployment SHA: $deploy_sha"
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Skip stale automatic deployment
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${MODAL_TRAFFIC_RELEASE_APPROVED_SHA:-}" == "$DEPLOY_SHA" ]]; then
            echo "Automatic held deployment skipped because this exact SHA is approved for an explicit manual release."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$latest_sha" != "$DEPLOY_SHA" ]]; then
            echo "Automatic CI run is stale ($DEPLOY_SHA); current main is $latest_sha. Skipping deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve deployment phase
        id: deployment_phase
        if: steps.freshness.outputs.current == 'true'
        env:
          REQUESTED_TRAFFIC_MODE: ${{ inputs.traffic_mode || '' }}
        run: |
          set -euo pipefail
          python backend/scripts/modal_deployment_phase.py resolve \
            --event-name "$GITHUB_EVENT_NAME" \
            --traffic-mode "${REQUESTED_TRAFFIC_MODE:-}" >> "$GITHUB_OUTPUT"

      # Reject unusable approval inputs before any Modal work. This local check
      # does not verify recovery or drain; the full gate below remains required.
      - name: Validate held-only Redis binding before provider operations
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=backend python - <<'PY'
          import os
          from uuid import UUID
          from app.core.deployment_hold import (
              DEFAULT_MODAL_REDIS_SECRET_NAME, deployment_traffic_held, modal_redis_secret_name,
          )
          deployment_traffic_held(source_deployment=True)
          if modal_redis_secret_name(os.environ.get("MODAL_REDIS_SECRET_NAME")) != DEFAULT_MODAL_REDIS_SECRET_NAME:
              value = os.environ.get("MODAL_REDIS_RECOVERY_FREEZE_ID", "")
              try:
                  valid = str(UUID(value)) == value
              except ValueError:
                  valid = False
              if not valid:
                  raise SystemExit("Alternate Redis recovery requires a canonical freeze UUID")
          PY

      - name: Reject absent or stale cutover approval inputs
        if: steps.freshness.outputs.current == 'true'
        env:
          MODAL_SCHEMA_CUTOVER_APPROVED_SHA: ${{ vars.MODAL_SCHEMA_CUTOVER_APPROVED_SHA }}
          MODAL_FORWARD_ROLLBACK_SHA: ${{ vars.MODAL_FORWARD_ROLLBACK_SHA }}
          MODAL_RECOVERY_VERIFIED_FOR_SHA: ${{ vars.MODAL_RECOVERY_VERIFIED_FOR_SHA }}
        run: python backend/scripts/check_modal_schema_cutover.py --approvals-only

      - name: Validate renderer deployment inputs
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys

          checks = {
              "operator_certification_asserted": os.environ.get("MODAL_ENGINE_VM_CERTIFIED") == "true",
              "immutable_image_id_valid": re.fullmatch(r"im-[A-Za-z0-9]{1,128}", os.environ.get("MODAL_ENGINE_VM_IMAGE_ID", "")) is not None,
              "asset_fingerprint_valid": re.fullmatch(r"[0-9a-f]{64}", os.environ.get("MODAL_ENGINE_VM_ASSETS_FINGERPRINT", "")) is not None,
          }
          valid = all(checks.values())
          print(json.dumps({"configuration_inputs_valid": valid, "certification_verified": False, "checks": checks}, sort_keys=True))
          sys.exit(0 if valid else 1)
          PY

      - name: Install pinned Modal CLI
        if: steps.freshness.outputs.current == 'true'
        run: python -m pip install "modal==1.5.4"

      # A release is a second, explicit deployment of a candidate already
      # serving in held mode. Require the exact target version and fresh held
      # health responses before deploying the same candidate without the hold.
      - name: Require approved SHA and healthy held candidate before release
        if: steps.freshness.outputs.current == 'true' && steps.deployment_phase.outputs.phase == 'held-release'
        env:
          BACKEND_URL: https://sanskarpandey2004--latexy-backend-fastapi-app.modal.run
          REQUESTED_TRAFFIC_MODE: ${{ inputs.traffic_mode || '' }}
        run: |
          set -euo pipefail
          identity_report="$(timeout --kill-after=5s 40s python backend/scripts/verify_modal_deployment_identity.py --environment main --expected-sha "$DEPLOY_SHA")"
          verified_sha="$(jq -er --arg expected "$DEPLOY_SHA" \
            'select(.status == "verified" and .source_sha == $expected) | .source_sha' \
            <<< "$identity_report")"
          check_health() {
            local path="$1"
            local expected_status="$2"
            local headers body
            headers="$(mktemp)"
            body="$(mktemp)"
            if ! curl --fail --silent --show-error --max-time 20 --dump-header "$headers" --output "$body" "$BACKEND_URL$path"; then
              rm -f "$headers" "$body"
              echo "Held candidate health request failed: $path" >&2
              return 1
            fi
            if ! grep -Eiq '^x-latexy-deployment-hold:[[:space:]]*true[[:space:]]*$' "$headers" \
              || ! jq -e --arg expected "$expected_status" '.status == $expected' "$body" >/dev/null; then
              rm -f "$headers" "$body"
              echo "Held candidate did not return expected health and hold state: $path" >&2
              return 1
            fi
            rm -f "$headers" "$body"
          }
          check_health /health healthy
          check_health /readyz ready
          check_health /jobs/health healthy
          # Source identity alone cannot detect a changed selector between the
          # held candidate and release. This attests the label, not secret data.
          timeout --kill-after=5s 40s python backend/scripts/verify_serving_identity.py \
            --url "$BACKEND_URL" --expected-sha "$DEPLOY_SHA" --attempts 1 \
            --expected-redis-secret-name "${MODAL_REDIS_SECRET_NAME:-latexy-redis}"
          python backend/scripts/modal_deployment_phase.py authorize-release \
            --event-name "$GITHUB_EVENT_NAME" \
            --traffic-mode "$REQUESTED_TRAFFIC_MODE" \
            --candidate-sha "$DEPLOY_SHA" \
            --approved-sha "${MODAL_TRAFFIC_RELEASE_APPROVED_SHA:-}" \
            --observed-sha "$verified_sha" \
            --held-health-verified

      - name: Validate read-only billing rollout safety
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        env:
          # Unset/false keeps configured live sales on hold. This non-secret
          # operator assertion never bypasses startup, schema or access checks.
          DODO_LIVE_BILLING_ACCEPTED: ${{ vars.DODO_LIVE_BILLING_ACCEPTED }}
        run: |
          set -euo pipefail
          args=(--source-revision "$DEPLOY_SHA" --expected-environment main --purpose rollout)
          if [[ "${DODO_LIVE_BILLING_ACCEPTED:-}" == "true" ]]; then
            args+=(--allow-configured-live)
          fi
          modal run --env main modal_app.py::billing_preflight "${args[@]}"

      # Use the candidate API's existing bindings before touching the schema or
      # serving functions. This checks configuration, not image certification.
      - name: Check renderer configuration before migrations
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        run: modal run --env main modal_app.py::renderer_preflight

      # The migration runs before a rolling deploy. An older serving process can
      # still write legacy billing columns, and an older PDF reader can expose a
      # completed but unaccepted candidate. Require a fresh, commit-scoped
      # operator cutover decision before changing the schema or serving image.
      - name: Require schema cutover and recovery approval
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODAL_SCHEMA_CUTOVER_APPROVED_SHA: ${{ vars.MODAL_SCHEMA_CUTOVER_APPROVED_SHA }}
          MODAL_FORWARD_ROLLBACK_SHA: ${{ vars.MODAL_FORWARD_ROLLBACK_SHA }}
          # Operator attests deployable recovery image availability and all
          # public artifact readers for this exact candidate, beyond source
          # heuristics and CI. An old value fails the equality check.
          MODAL_RECOVERY_VERIFIED_FOR_SHA: ${{ vars.MODAL_RECOVERY_VERIFIED_FOR_SHA }}
        run: python backend/scripts/check_modal_schema_cutover.py

      # Modal App STOPPED state follows container termination; it does not
      # prove that queued or in-flight business work was gracefully settled.
      # A separately authorized external drain/recovery procedure must finish
      # first. This gate only checks its fresh, candidate-scoped record and
      # performs read-only Modal App name/ID/state queries. It never stops Apps.
      # This initial held cutover gate is not used for release: the candidate
      # App is already serving in held mode then, so it cannot also be the old
      # stopped App. The identity/state query is immediately before Alembic.
      - name: Apply production database migrations after external drain verification
        if: steps.freshness.outputs.current == 'true' && steps.deployment_phase.outputs.phase == 'held-cutover'
        working-directory: backend
        env:
          MODAL_RECOVERY_OPERATION_SIGNING_KEY: ${{ secrets.MODAL_RECOVERY_OPERATION_SIGNING_KEY }}
          MODAL_DRAIN_PROCEDURE_APPROVED_FOR_SHA: ${{ vars.MODAL_DRAIN_PROCEDURE_APPROVED_FOR_SHA }}
          MODAL_DRAIN_PROCEDURE_APP_ID: ${{ vars.MODAL_DRAIN_PROCEDURE_APP_ID }}
          MODAL_DRAIN_PROCEDURE_COMPLETED_AT: ${{ vars.MODAL_DRAIN_PROCEDURE_COMPLETED_AT }}
          MODAL_DRAIN_PROCEDURE_EVIDENCE_REFERENCE: ${{ vars.MODAL_DRAIN_PROCEDURE_EVIDENCE_REFERENCE }}
        run: |
          set -euo pipefail
          drain_report="$(python scripts/verify_modal_drain.py \
            --app-name latexy-backend \
            --environment main \
            --expected-deploy-sha "$DEPLOY_SHA" \
            --max-age-seconds 300)"
          app_id="$(jq -er '.current_modal_app_id' <<<"$drain_report")"
          token="$(python -m scripts.modal_operation_authorization \
            --action migrate --sha "$DEPLOY_SHA" --app-id "$app_id" \
            --redis-secret-name "${MODAL_REDIS_SECRET_NAME:-latexy-redis}")"
          echo "::add-mask::$token"
          modal run --env main modal_app.py::migrate \
            --source-revision "$DEPLOY_SHA" --authorization-token "$token"

      - name: Freeze primary authority before held backup qualification
        if: steps.freshness.outputs.current == 'true' && steps.deployment_phase.outputs.phase == 'held-cutover' && env.MODAL_REDIS_SECRET_NAME != '' && env.MODAL_REDIS_SECRET_NAME != 'latexy-redis'
        working-directory: backend
        env:
          MODAL_RECOVERY_OPERATION_SIGNING_KEY: ${{ secrets.MODAL_RECOVERY_OPERATION_SIGNING_KEY }}
          MODAL_DRAIN_PROCEDURE_APPROVED_FOR_SHA: ${{ vars.MODAL_DRAIN_PROCEDURE_APPROVED_FOR_SHA }}
          MODAL_DRAIN_PROCEDURE_APP_ID: ${{ vars.MODAL_DRAIN_PROCEDURE_APP_ID }}
          MODAL_DRAIN_PROCEDURE_COMPLETED_AT: ${{ vars.MODAL_DRAIN_PROCEDURE_COMPLETED_AT }}
          MODAL_DRAIN_PROCEDURE_EVIDENCE_REFERENCE: ${{ vars.MODAL_DRAIN_PROCEDURE_EVIDENCE_REFERENCE }}
        run: |
          set -euo pipefail
          # Recheck after migration; a prior stopped-App observation can expire.
          drain_report="$(python scripts/verify_modal_drain.py \
            --app-name latexy-backend --environment main \
            --expected-deploy-sha "$DEPLOY_SHA" --max-age-seconds 300)"
          app_id="$(jq -er '.current_modal_app_id' <<<"$drain_report")"
          token="$(python -m scripts.modal_operation_authorization \
            --action freeze --sha "$DEPLOY_SHA" --app-id "$app_id" \
            --redis-secret-name "$MODAL_REDIS_SECRET_NAME" \
            --freeze-id "$MODAL_REDIS_RECOVERY_FREEZE_ID")"
          echo "::add-mask::$token"
          modal run --env main modal_app.py::freeze_redis_recovery \
            --source-revision "$DEPLOY_SHA" --freeze-id "$MODAL_REDIS_RECOVERY_FREEZE_ID" \
            --authorization-token "$token"

      # The first preflight cannot see provider columns on a pre-0065 schema.
      # Recheck after migration, while ingress remains held, so a legacy write
      # during the cutover window blocks serving the candidate build.
      - name: Recheck billing identities after migration
        if: steps.freshness.outputs.current == 'true' && steps.deployment_phase.outputs.phase == 'held-cutover'
        working-directory: backend
        env:
          DODO_LIVE_BILLING_ACCEPTED: ${{ vars.DODO_LIVE_BILLING_ACCEPTED }}
        run: |
          set -euo pipefail
          args=(--source-revision "$DEPLOY_SHA" --expected-environment main --purpose rollout)
          if [[ "${DODO_LIVE_BILLING_ACCEPTED:-}" == "true" ]]; then
            args+=(--allow-configured-live)
          fi
          modal run --env main modal_app.py::billing_preflight "${args[@]}"

      - name: Deploy backend with a rolling update
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        run: modal deploy --env main --strategy rolling --tag "$DEPLOY_SHA" modal_app.py::app

      # Modal can exit successfully with "Deployment skipped: no changes detected"
      # while the production pointer still names an older source revision.
      - name: Verify Modal production deployment identity
        if: steps.freshness.outputs.current == 'true'
        run: timeout --kill-after=5s 40s python backend/scripts/verify_modal_deployment_identity.py --environment main --expected-sha "$DEPLOY_SHA"

      # The pointer above proves what was deployed; it does not prove which
      # revision the containers answering requests are running. Production once
      # served a backend 32 commits behind while every other signal was green.
      # Require the serving process itself to attest the exact revision.
      - name: Verify serving backend revision
        if: steps.freshness.outputs.current == 'true'
        env:
          BACKEND_URL: https://sanskarpandey2004--latexy-backend-fastapi-app.modal.run
        run: |
          set -euo pipefail
          timeout --kill-after=5s 260s python backend/scripts/verify_serving_identity.py \
            --url "$BACKEND_URL" --expected-sha "$DEPLOY_SHA" \
            --expected-redis-secret-name "${MODAL_REDIS_SECRET_NAME:-latexy-redis}"

      - name: Synchronize source-owned production templates
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        run: modal run --env main modal_app.py::sync_templates

      - name: Backfill missing template previews
        if: steps.freshness.outputs.current == 'true'
        working-directory: backend
        run: modal run --env main scripts/backfill_template_assets.py

      - name: Verify production backend health
        if: steps.freshness.outputs.current == 'true'
        env:
          BACKEND_URL: https://sanskarpandey2004--latexy-backend-fastapi-app.modal.run
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            check_health() {
              local path="$1"
              local expected_status="$2"
              local expected_hold="$MODAL_DEPLOYMENT_TRAFFIC_HOLD"
              local headers body
              headers="$(mktemp)"
              body="$(mktemp)"
              if ! curl --fail --silent --show-error --max-time 20 --dump-header "$headers" --output "$body" "$BACKEND_URL$path"; then
                rm -f "$headers" "$body"
                return 1
              fi
              if ! grep -Eiq "^x-latexy-deployment-hold:[[:space:]]*$expected_hold[[:space:]]*$" "$headers" \
                || ! jq -e --arg expected "$expected_status" '.status == $expected' "$body" >/dev/null; then
                rm -f "$headers" "$body"
                return 1
              fi
              rm -f "$headers" "$body"
            }
            if check_health /health healthy \
                && check_health /readyz ready \
                && check_health /jobs/health healthy; then
              exit 0
            fi
            echo "Health check attempt ${attempt}/18 failed; retrying in 10s"
            sleep 10
          done
          echo "Production backend did not become healthy after deployment" >&2
          exit 1

      - name: Verify source template catalog and assets
        if: steps.freshness.outputs.current == 'true'
        env:
          BACKEND_URL: https://sanskarpandey2004--latexy-backend-fastapi-app.modal.run
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl --fail --silent --show-error --max-time 20 \
            "$BACKEND_URL/config/entitlements?include_quotas=false" > "$tmpdir/feature-map.json"
          curl --fail --silent --show-error --max-time 20 \
            "$BACKEND_URL/templates/?category=presentation" > "$tmpdir/presentation-catalog.json"
          decision="$(python backend/scripts/verify_public_template_catalog.py \
            --feature-map "$tmpdir/feature-map.json" \
            --catalog "$tmpdir/presentation-catalog.json" \
            --expected-origin "$BACKEND_URL")"
          catalog_state="$(jq -er '.catalog_state' <<<"$decision")"
          if [[ "$catalog_state" == "feature_hidden" ]]; then
            echo "Public B05 feature is disabled; verified the presentation catalog is empty and skipped public asset checks."
            exit 0
          fi
          if [[ "$catalog_state" != "feature_enabled" ]]; then
            echo "Public presentation catalog verification returned an unknown state" >&2
            exit 1
          fi
          echo "Verified all source-owned presentation templates; custom presentation entries are permitted."
          jq -er '.source_template_ids[]' <<<"$decision" | while IFS= read -r template_id; do
            curl --fail --silent --show-error --location --max-time 30 --output /dev/null \
              "$BACKEND_URL/templates/$template_id/thumbnail"
            curl --fail --silent --show-error --location --max-time 30 --output /dev/null \
              "$BACKEND_URL/templates/$template_id/pdf"
          done
