apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: latexy
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log notice;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;

        # Performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 50M;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=compile:10m rate=2r/s;
        limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

        # Upstream servers
        upstream frontend {
            server latexy-frontend-service:80;
        }

        upstream backend {
            server latexy-backend-service:8030;
        }

        upstream flower {
            server flower-service:5555;
        }

        # Main server block
        server {
            listen 80;
            server_name _;

            # Security headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Referrer-Policy "strict-origin-when-cross-origin";

            # Frontend
            location / {
                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Cache static assets
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                    proxy_pass http://frontend;
                    proxy_cache_valid 200 1d;
                    add_header Cache-Control "public, immutable";
                }
            }

            # Better Auth and BYOK proxy handlers are Next.js route handlers,
            # not FastAPI routes. Longer-prefix match keeps them on the frontend.
            #
            # Only the credential-submitting endpoints get the strict `login`
            # zone. The /api/auth/ prefix as a whole must not: it also carries
            # /api/auth/get-session, which useSession() fires on every page
            # load, so a 5r/m budget makes the app unusable behind a shared IP.
            location = /api/auth/sign-in/email {
                limit_req zone=login burst=5 nodelay;

                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /api/auth/sign-up/email {
                limit_req zone=login burst=5 nodelay;

                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /api/auth/request-password-reset {
                limit_req zone=login burst=5 nodelay;

                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /api/auth/reset-password {
                limit_req zone=login burst=5 nodelay;

                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/auth/ {
                limit_req zone=api burst=20 nodelay;

                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/byok/ {
                limit_req zone=api burst=20 nodelay;

                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
            }

            # Collaboration / job sockets reached through the /api prefix.
            # Longer-prefix match, so it wins over `location /api/` below and
            # keeps long-lived sockets out of that block's 60s read timeout
            # and per-IP request budget.
            location /api/ws/ {
                proxy_pass http://backend/ws/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 86400;
            }

            # Backend API. The trailing slash on proxy_pass strips the /api
            # prefix — FastAPI serves these routes at the root.
            location /api/ {
                limit_req zone=api burst=20 nodelay;

                proxy_pass http://backend/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Timeouts for API requests
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            # Compilation endpoint (stricter rate limiting)
            location /compile {
                limit_req zone=compile burst=5 nodelay;
                
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Extended timeouts for compilation
                proxy_connect_timeout 120s;
                proxy_send_timeout 120s;
                proxy_read_timeout 120s;
            }

            # WebSocket support for job updates
            location /ws/ {
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # WebSocket timeouts
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 300s;
            }

            # Nginx's own liveness/readiness endpoint. Answered locally so a
            # backend outage cannot take every proxy pod out of the Service.
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Flower monitoring (restrict access in production)
            location /flower/ {
                auth_basic "Flower Monitoring";
                auth_basic_user_file /etc/nginx/.htpasswd;
                
                proxy_pass http://flower/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Deny access to sensitive files
            location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
            }

            location ~ \.(env|git|svn)$ {
                deny all;
                access_log off;
                log_not_found off;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: latexy
  labels:
    app: nginx
    component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        component: proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: flower-htpasswd
          mountPath: /etc/nginx/.htpasswd
          subPath: .htpasswd
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      # Generated by k8s/deploy.sh from FLOWER_USER/FLOWER_PASSWORD.
      - name: flower-htpasswd
        secret:
          secretName: flower-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: latexy
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: LoadBalancer
  # Preserve the client source address. Without this, kube-proxy SNATs the packet and
  # $remote_addr is the node IP — nginx would then stamp X-Real-IP with the node IP,
  # the backend trusts it (TRUST_PROXY_HEADERS=true), and every anonymous user behind
  # a node would share one rate-limit bucket. nginx's own limit_req zones key on
  # $binary_remote_addr and collapse the same way.
  # If an L7 cloud load balancer is put in front instead (so the pod only ever sees the
  # LB), replace this with `set_real_ip_from <LB CIDR>; real_ip_header X-Forwarded-For;
  # real_ip_recursive on;` in the http block above — never both a broad
  # set_real_ip_from and a spoofable header.
  externalTrafficPolicy: Local
