apiVersion: apps/v1
kind: Deployment
metadata:
  name: latexy-backend
  namespace: latexy
  labels:
    app: latexy-backend
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: latexy-backend
  template:
    metadata:
      labels:
        app: latexy-backend
        version: v1
    spec:
      containers:
      - name: backend
        image: __LATEXY_BACKEND_IMAGE__
        ports:
        - containerPort: 8030
        env:
        # Settings reads ENVIRONMENT (app/core/config.py). FASTAPI_ENV is not
        # read anywhere and left the app in development mode.
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: environment
        - name: DEBUG
          value: "false"
        - name: PORT
          value: "8030"
        # The nginx deployment is the only ingress and overwrites X-Real-IP with
        # $remote_addr, so the rate limiters can bucket per real client. Without
        # this every user shares one "untrusted proxy" bucket and any single
        # caller can 429 the whole site.
        - name: TRUST_PROXY_HEADERS
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: trust-proxy-headers
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: cors-origins
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: redis-url
        # The API pod enqueues every compile/optimize/ATS task. Without these it
        # falls back to the config defaults (redis://localhost:6379/...), which
        # is a non-existent broker inside the pod.
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: redis-url
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: redis-url
        - name: REDIS_CACHE_URL
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: redis-cache-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: anthropic-api-key
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: google-api-key
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: openrouter-api-key
        - name: API_KEY_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: api-key-encryption-key
        - name: GOOGLE_DRIVE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: google-drive-client-id
        - name: GOOGLE_DRIVE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: google-drive-client-secret
        - name: GOOGLE_DRIVE_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: google-drive-redirect-uri
        - name: EMAIL_ENABLED
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: email-enabled
        - name: EMAIL_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: email-provider
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: resend-api-key
        - name: EMAIL_FROM
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: email-from-address
        - name: EMAIL_FROM_NAME
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: email-from-name
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: smtp-host
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: email-smtp-port
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: smtp-user
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: smtp-password
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: better-auth-secret
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: jwt-secret-key
        - name: RAZORPAY_KEY_ID
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: razorpay-key-id
        - name: RAZORPAY_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: razorpay-key-secret
        - name: RAZORPAY_PLAN_WEEKLY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: razorpay-plan-weekly
        - name: RAZORPAY_WEEKLY_AMOUNT
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: razorpay-weekly-amount
        - name: RAZORPAY_LIFETIME_AMOUNT
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: razorpay-lifetime-amount
        - name: RAZORPAY_BILLING_CURRENCY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: razorpay-billing-currency
        - name: RAZORPAY_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: razorpay-webhook-secret
        # JSON object mapping coupon code -> Razorpay offer ID, e.g.
        # {"LAUNCH20":"offer_ABC123"}. Razorpay only discounts a subscription
        # through an offer, so a percentage coupon with no mapping here is
        # refused at checkout rather than charged at full price.
        - name: RAZORPAY_COUPON_OFFERS
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: razorpay-coupon-offers
        - name: REFERRAL_PROGRAM_ENABLED
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: referral-program-enabled
        - name: REFERRAL_REWARD_DAYS
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: referral-reward-days
        - name: REFERRAL_QUALIFYING_PLAN_FAMILIES
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: referral-qualifying-plan-families
        - name: REFERRAL_MAX_ATTRIBUTIONS_PER_REFERRER
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: referral-max-attributions-per-referrer
        - name: REFERRAL_ATTRIBUTION_WINDOW_HOURS
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: referral-attribution-window-hours
        - name: BETTER_AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: frontend-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8030
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8030
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: temp-storage
          mountPath: /app/temp
      imagePullSecrets:
      - name: registry-secret
      volumes:
      - name: temp-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: latexy-backend-service
  namespace: latexy
  labels:
    app: latexy-backend
spec:
  selector:
    app: latexy-backend
  ports:
  - protocol: TCP
    port: 8030
    targetPort: 8030
  type: ClusterIP
