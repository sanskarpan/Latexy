apiVersion: v1
kind: Namespace
metadata:
  name: latexy
  labels:
    name: latexy
    environment: production
---
# NOTE: no Secret manifests are committed here on purpose.
#
#   latexy-secrets, postgres-secret, redis-secret and flower-htpasswd are
#   provisioned at deploy time by k8s/deploy.sh, which generates the passwords
#   it can generate (postgres, redis, flower, JWT/auth secrets) and reads the
#   externally-owned values (LLM/Razorpay API keys) from the environment.
#   Run `./k8s/deploy.sh --help` for the full list of variables.
#
#   If you use an external secret store instead (External Secrets Operator,
#   Sealed Secrets, Vault Agent, cloud secret manager CSI driver), create the
#   same secret names/keys from that source and run deploy.sh with
#   SKIP_SECRET_PROVISIONING=true.
apiVersion: v1
kind: ConfigMap
metadata:
  name: latexy-config
  namespace: latexy
data:
  # Browser-visible values. These are inlined into the frontend bundle at image
  # build time (NEXT_PUBLIC_*), so they must match the build args used for the
  # frontend image — the pod env below only documents them.
  api-url: "/api"
  ws-url: "wss://latexy.com"
  frontend-url: "https://latexy.com"
  environment: "production"
  # From-address for transactional mail (lib/email.ts); the domain must be
  # verified with the provider behind latexy-secrets/resend-api-key.
  email-from: "Latexy <no-reply@latexy.com>"
  # The bundled nginx is the only ingress and it overwrites X-Real-IP with
  # $remote_addr, so the backend and the frontend's auth rate limiter can trust
  # it for per-client rate-limit buckets.
  trust-proxy-headers: "true"
  # Coupon code -> Razorpay offer ID (JSON object). Razorpay only discounts a
  # subscription through an offer, so a percentage coupon missing from this map
  # is refused at checkout. Empty means "no percentage coupon is redeemable".
  razorpay-coupon-offers: "{}"
  # JSON array — pydantic-settings parses List[str] settings as JSON.
  cors-origins: '["https://latexy.com","https://www.latexy.com"]'
