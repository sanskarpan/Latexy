apiVersion: apps/v1
kind: Deployment
metadata:
  name: latexy-frontend
  namespace: latexy
  labels:
    app: latexy-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: latexy-frontend
  template:
    metadata:
      labels:
        app: latexy-frontend
        component: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/sanskarpan/latexy-frontend:latest
        ports:
        - containerPort: 5180
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5180"
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: api-url
        - name: NEXT_PUBLIC_WS_URL
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: ws-url
        # Better Auth runs in this pod (nginx routes /api/auth/ here). lib/auth.ts
        # throws without BETTER_AUTH_SECRET in production and opens a pg Pool
        # straight from DATABASE_URL.
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: better-auth-secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: database-url
        - name: BETTER_AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: frontend-url
        # Server-only backend base. NEXT_PUBLIC_API_URL is the same-origin path
        # "/api", which Node's fetch() cannot parse; middleware.ts and the
        # /api/byok/ route handlers need an absolute in-cluster URL.
        - name: BACKEND_URL
          value: "http://latexy-backend-service:8030"
        # The nginx deployment is the only ingress and overwrites X-Real-IP with
        # $remote_addr, so the auth rate limiter can bucket per real client.
        # Without this it distrusts forwarding headers and puts every proxied
        # caller in one shared bucket.
        - name: TRUST_PROXY_HEADERS
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: trust-proxy-headers
        # lib/email.ts refuses to fall back to console logging in production, so
        # verification / password-reset sends throw without a provider key.
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: resend-api-key
        - name: EMAIL_FROM
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: email-from
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5180
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5180
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: latexy-frontend-service
  namespace: latexy
  labels:
    app: latexy-frontend
spec:
  selector:
    app: latexy-frontend
  ports:
  - port: 80
    targetPort: 5180
    protocol: TCP
  type: ClusterIP
