apiVersion: batch/v1
kind: Job
metadata:
  name: latexy-migrations
  namespace: latexy
  labels:
    app: latexy-migrations
    component: database-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: latexy-migrations
        component: database-migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: migrations
        image: __LATEXY_BACKEND_IMAGE__
        imagePullPolicy: Always
        command: ["alembic", "upgrade", "head"]
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: latexy-config
              key: environment
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: database-url
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: better-auth-secret
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: jwt-secret-key
        - name: API_KEY_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: latexy-secrets
              key: api-key-encryption-key
